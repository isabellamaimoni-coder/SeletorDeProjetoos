
    <section class="py-5" style="background-color: #ddd3d3;">


        <div class="container">

            <div class="text-center mb-5">
                <h2 style="color: #5a3928;">Trabalhe Conosco</h2>
                <p style="color: #6b5b55;">
                    Preencha o formulário abaixo e envie seus dados para fazer parte da nossa equipe.
                </p>
            </div>

            <div class="row justify-content-center">

                <div class="col-lg-8">

                    <div class="p-4 p-md-5 rounded-4 shadow" style="background-color: white;">

                        <div class="row">

                            <div class="col-md-6">

                                <div class="mb-3">
                                    <label for="nome" class="form-label">
                                        Nome completo
                                    </label>

                                    <input type="text" class="form-control" id="nome"
                                        placeholder="DIGITE SEU NOME COMPLETO">
                                </div>

                            </div>

                            <div class="col-md-6">

                                <div class="mb-3">
                                    <label for="celular" class="form-label">
                                        Celular
                                    </label>

                                    <input type="tel" class="form-control" id="celular"
                                        placeholder="DIGITE SEU NUMERO DE CELULAR">
                                </div>

                            </div>

                            <div class="col-12">

                                <div class="mb-3">
                                    <label for="email" class="form-label">
                                        E-mail
                                    </label>

                                    <input type="email" class="form-control" id="email" placeholder="DIGITE SEU E-MAIL">
                                </div>

                            </div>

                            <div class="col-md-6">

                                <div class="mb-3">

                                    <label class="form-label">
                                        Unidade
                                    </label>

                                    <select class="form-select" required>

                                        <option value="">
                                            Selecione uma unidade
                                        </option>

                                        <option>
                                            Orlando
                                        </option>

                                        <option>
                                            São Paulo
                                        </option>

                                        <option>
                                            Rio de Janeiro
                                        </option>

                                    </select>

                                </div>

                            </div>

                            <div class="col-md-6">

                                <div class="mb-3">

                                    <label class="form-label">
                                        Vaga
                                    </label>

                                    <select class="form-select" required>

                                        <option value="">
                                            Selecione uma vaga
                                        </option>

                                        <option>
                                            Atendente
                                        </option>

                                        <option>
                                            Garçom
                                        </option>

                                        <option>
                                            Cozinheiro
                                        </option>

                                        <option>
                                            Auxiliar de cozinha
                                        </option>

                                    </select>

                                </div>

                            </div>

                            <div class="col-12">

                                <div class="mb-3">

                                    <label for="descricao" class="form-label">
                                        Descrição
                                    </label>

                                    <textarea class="form-control" id="descricao" rows="4"
                                        placeholder="DESCREVA SUA EXPERIÊNCIA"></textarea>

                                </div>

                            </div>

                            <div class="col-12 text-center mt-3">

                                <button type="submit" class="btn px-5 py-2"
                                    style="background-color: #5a3928; color: white;">
                                    Enviar
                                </button>

                            </div>

                        </div>

                    </div>

                </div>

            </div>

        </div>

        <div class="container-fluid mt-5 pt-4 border-top">

            <div class="text-center">

                <p class="mb-0" style="color: #5a3928;">
                    © 2026 Olive Garden - Todos os direitos reservados.
                </p>

            </div>

        </div>


    </section>
